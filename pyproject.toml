[project]
name = "c64re-agent"
version = "0.1.0"
description = "C64 Reverse Engineering Agent — multi-agent LangGraph skeleton."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.8",
    "langsmith>=0.1.140",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    # Tool dependencies — required at runtime, not optional.
    "capstone>=5.0.1",
    "tavily-python>=0.5.0",
    "mcp>=1.0.0",
    "httpx>=0.27",
    "langgraph-cli[inmem]>=0.4.24",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.1.55",
    "pytest>=8",
]
ui = [
    "streamlit>=1.36",
    "graphviz>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph"]

[tool.pytest.ini_options]
markers = [
    "slow: opt-in tests that may make external calls or take substantial time",
    "golden: end-to-end golden-question graph evaluations",
]
